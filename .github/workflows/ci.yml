# Continuous integration — public repo: standard runners are free.
# Mirrors local `make ci` (sites + CSS + MinGW smoke build).
name: CI

on:
  push:
    branches: [master, GW2-InGame-Helper-Beta]
  pull_request:
    branches: [master, GW2-InGame-Helper-Beta]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: validate + MinGW smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            python3

      - name: Verify MinGW
        run: |
          x86_64-w64-mingw32-g++ --version
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-ld --version

      - name: Local CI gate
        run: make ci
