<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Complete GW2 Legendaries Collection</title>
<style>
  :root {
    --bg: #0b0a10;
    --text: #e4e4e7;
    --muted: #71717a;
    --muted-2: #52525b;
    --zinc-100: #f4f4f5;
    --zinc-200: #e4e4e7;
    --zinc-500: #71717a;
    --zinc-600: #52525b;
    --purple-200: #e9d5ff;
    --purple-300: #d8b4fe;
    --purple: #a855f7;
    --border: rgba(255,255,255,0.05);
    --panel: rgba(255,255,255,0.03);
    --panel-2: rgba(255,255,255,0.02);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    pointer-events: none;
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at top, rgba(139,92,246,0.14), transparent 55%);
    z-index: 0;
  }
  .shell { position: relative; z-index: 1; min-height: 100vh; }
  header.top {
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid var(--border);
    background: rgba(11,10,16,0.80);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .top-inner, main {
    max-width: 56rem;
    margin: 0 auto;
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .top-inner {
    display: flex; align-items: center; gap: 0.625rem;
    padding-top: 1rem; padding-bottom: 1rem;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 0.5rem;
    color: var(--zinc-100); text-decoration: none;
    font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .brand svg { width: 1rem; height: 1rem; color: var(--purple-300); flex-shrink: 0; }
  .brand:hover { color: var(--purple-200); }
  main { padding-top: 1.5rem; padding-bottom: 5rem; }
  footer.credit {
    max-width: 56rem; margin: 0 auto;
    padding: 0 1.25rem 2.5rem;
    font-size: 0.75rem; color: var(--zinc-600);
  }
  footer.credit strong { color: var(--zinc-500); font-weight: 600; }
  h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.025em;
    color: var(--zinc-100);
  }
  @media (min-width: 640px) {
    h1 { font-size: 1.5rem; }
  }
  .space-y-7 > * + * { margin-top: 1.75rem; }
  .space-y-8 > * + * { margin-top: 2rem; }
  .space-y-3 > * + * { margin-top: 0.75rem; }
  .search-wrap { position: relative; }
  .search-wrap svg {
    position: absolute; left: 0.875rem; top: 50%;
    width: 1rem; height: 1rem;
    transform: translateY(-50%);
    color: var(--zinc-500);
    pointer-events: none;
  }
  .search {
    width: 100%; height: 2.75rem;
    border: 1px solid var(--border);
    border-radius: 0.375rem;
    background: var(--panel);
    padding: 0 0.75rem 0 2.5rem;
    color: var(--zinc-100);
    font-size: 0.875rem;
    outline: none;
  }
  .search::placeholder { color: var(--zinc-600); }
  .search:focus { box-shadow: 0 0 0 1px rgba(192,132,252,0.40); }
  .cats { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .cat {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--zinc-500);
    border-radius: 999px;
    padding: 0.375rem 0.875rem;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .cat:hover { background: rgba(168,85,247,0.08); color: var(--purple-200); }
  .cat.active {
    background: rgba(168,85,247,0.90);
    border-color: transparent;
    color: #fff;
  }
  .alpha-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    border: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: 0.75rem;
    padding: 0.625rem 0.75rem;
  }
  .letters { display: flex; flex-wrap: wrap; gap: 0.15rem; }
  .letter {
    width: 1.75rem; height: 1.75rem;
    border: 0; border-radius: 0.375rem;
    background: transparent;
    color: var(--zinc-500);
    font-size: 0.6875rem;
    font-weight: 500;
    cursor: pointer;
  }
  .letter:hover { background: rgba(168,85,247,0.15); color: var(--purple-200); }
  .count { flex-shrink: 0; font-size: 0.6875rem; color: var(--zinc-600); }
  .letter-sec { scroll-margin-top: 7rem; }
  .letter-head {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 0.75rem;
  }
  .letter-head h2 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    color: rgba(216,180,254,0.90);
  }
  .letter-head .rule {
    height: 1px; flex: 1;
    background: linear-gradient(to right, rgba(192,132,252,0.20), transparent);
  }
  .letter-head .n { font-size: 0.6875rem; color: var(--zinc-600); }
  .grid {
    display: grid;
    gap: 0.5rem;
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
  .card {
    display: flex; align-items: center; gap: 1rem;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 0.75rem;
    padding: 0.875rem 1rem;
    text-decoration: none;
    color: inherit;
    transition: border-color .3s, background .3s;
    cursor: pointer;
  }
  .card:hover {
    border-color: rgba(192,132,252,0.40);
    background: rgba(168,85,247,0.07);
  }
  .avatar {
    flex-shrink: 0;
    width: 2.5rem; height: 2.5rem;
    border-radius: 0.5rem;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(to bottom right, rgba(168,85,247,0.30), rgba(217,70,239,0.10));
    color: var(--purple-200);
    font-size: 0.875rem;
    font-weight: 600;
  }
  .avatar.lg {
    width: 4rem; height: 4rem;
    border-radius: 1rem;
    font-size: 1.5rem;
    color: #f3e8ff;
    background: linear-gradient(to bottom right, rgba(168,85,247,0.40), rgba(217,70,239,0.10));
  }
  .card .meta { min-width: 0; flex: 1; }
  .card .name {
    margin: 0;
    font-size: 0.9375rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--zinc-100);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .sub {
    margin: 0;
    font-size: 0.75rem;
    color: var(--zinc-500);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chev {
    flex-shrink: 0;
    width: 1rem; height: 1rem;
    color: var(--zinc-600);
    transition: transform .3s, color .3s;
  }
  .card:hover .chev { transform: translateX(2px); color: var(--purple-300); }
  .empty, .loading {
    padding: 6rem 0;
    text-align: center;
    font-size: 0.875rem;
    color: var(--zinc-500);
  }
  .back {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--zinc-500);
    text-decoration: none;
    margin-bottom: 2rem;
  }
  .back:hover { color: var(--purple-300); }
  .back svg { width: 0.875rem; height: 0.875rem; }
  .detail-head {
    display: flex; align-items: center; gap: 1.25rem;
    margin-bottom: 2rem;
  }
  .detail-head h1 {
    font-size: 1.5rem;
  }
  @media (min-width: 640px) {
    .detail-head h1 { font-size: 1.875rem; }
  }
  .detail-sub {
    margin: 0.25rem 0 0;
    font-size: 0.75rem;
    letter-spacing: 0.02em;
    color: rgba(216,180,254,0.80);
  }
  .detail-card {
    border: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: 1rem;
    padding: 0 1.25rem 0.25rem;
  }
  .field {
    border-top: 1px solid var(--border);
    padding: 1rem 0;
  }
  .field:first-child { border-top: 0; }
  .field .lbl {
    margin: 0;
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--zinc-600);
  }
  .field .val {
    margin: 0.375rem 0 0;
    font-size: 0.875rem;
    line-height: 1.625;
    color: var(--zinc-200);
  }
  .hidden { display: none !important; }
</style>
</head>

":"6a714e7816fdb6540c2d558b","name":"Shooshadoo","category":"Weapon","item_type":"Shield","generation":"Gen 2","acquisition":"Complete the Shooshadoo collections and craft the precursor line.","notes":"","slug":"6a714e7816fdb6540c2d558b"},{"id":"6a714e7816fdb6540c2d557d","name":"Sunrise","category":"Weapon","item_type":"Greatsword","generation":"Gen 1","acquisition":"Craft with Gift of Sunrise, Gift of Fortune, Gift of Mastery and Dawn (precursor).","notes":"Combines with Twilight to create Eternity.","slug":"6a714e7816fdb6540c2d557d"},{"id":"6a714e7816fdb6540c2d55b4","name":"The Ascension","category":"Back Item","item_type":"Back Item","generation":"Other","acquisition":"PvP reward track and collections, crafted with Ascended Shards of Glory.","notes":"","slug":"6a714e7816fdb6540c2d55b4"},{"id":"6a714e7816fdb6540c2d556c","name":"The Bifrost","category":"Weapon","item_type":"Staff","generation":"Gen 1","acquisition":"Craft with Gift of the Bifrost, Gift of Fortune, Gift of Mastery and The Legend (precursor).","notes":"Leaves a trail of rainbow colours as you walk.","slug":"6a714e7816fdb6540c2d556c"},{"id":"6a714e7816fdb6540c2d558c","name":"The Binding of Ipos","category":"Weapon","item_type":"Focus","generation":"Gen 2","acquisition":"Complete The Binding of Ipos collections and craft the precursor line.","notes":"","slug":"6a714e7816fdb6540c2d558c"},{"id":"6a714e7816fdb6540c2d5580","name":"The Dreamer","category":"Weapon","item_type":"Short Bow","generation":"Gen 1","acquisition":"Craft with Gift of The Dreamer, Gift of Fortune, Gift of Mastery and The Lover (precursor).","notes":"Fires rainbow unicorns.","slug":"6a714e7816fdb6540c2d5580"},{"id":"6a714e7816fdb6540c2d556e","name":"The Flameseeker Prophecies","category":"Weapon","item_type":"Shield","generation":"Gen 1","acquisition":"Craft with Gift of the Flameseeker Prophecies, Gift of Fortune, Gift of Mastery and The Chosen (precursor).","notes":"Projects glowing pages of the Flameseeker Prophecies.","slug":"6a71 {"id":"6a714e7816fdb6540c2d558e","name":"Verdarach","category":"Weapon","item_type":"Sword","generation":"Gen 2","acquisition":"Complete the Verdarach collections and craft the precursor line.","notes":"","slug":"6a714e7816fdb6540c2d558e"},{"id":"6a714e7816fdb6540c2d55ae","name":"Vision","category":"Trinket","item_type":"Accessory","generation":"Other","acquisition":"Complete the Living World Season 4 collections and craft in the Mystic Forge.","notes":"","slug":"6a714e7816fdb6540c2d55ae"},{"id":"6a714e7816fdb6540c2d55b5","name":"Warbringer","category":"Back Item","item_type":"Back Item","generation":"Other","acquisition":"WvW reward: collections plus Memories of Battle and Skirmish Claim Tickets.","notes":"","slug":"6a714e7816fdb6540c2d55b5"},{"id":"6a714e7816fdb6540c2d558f","name":"Xiuquatl","category":"Weapon","item_type":"Scepter","generation":"Gen 2","acquisition":"Complete the Xiuquatl collections and craft the precursor line.","notes":"","slug":"6a714e7816fdb6540c2d558f"}];
</script>
<script>
(function () {
  var CATS = ["All", "Weapon", "Armor", "Trinket", "Back Item", "Sigil", "Rune"];
  var items = window.LEGENDARIES || [];
  var state = { q: "", cat: "All" };

  var elList = document.getElementById("view-list");
  var elDetail = document.getElementById("view-detail");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function subLine(it) {
    var parts = [];
    if (it.item_type) parts.push(it.item_type);
    else if (it.category) parts.push(it.category);
    if (it.generation && it.generation !== "Other") parts.push(it.generation);
    return parts.join(" · ");
  }

  function detailMeta(it) {
    var parts = [it.item_type, it.category];
    if (it.generation && it.generation !== "Other") parts.push(it.generation);
    return parts.filter(Boolean).join(" · ");
  }

  function filtered() {
    var q = state.q.trim().toLowerCase();
    return items
      .filter(function (it) {
        if (state.cat !== "All" && it.category !== state.cat) return false;
        if (!q) return true;
        return (it.name || "").toLowerCase().indexOf(q) >= 0 ||
          (it.item_type || "").toLowerCase().indexOf(q) >= 0;
      })
      .slice()
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  function groupByLetter(list) {
    var map = {};
    list.forEach(function (it) {
      var L = ((it.name || "#")[0] || "#").toUpperCase();
      (map[L] = map[L] || []).push(it);
    });
    return Object.keys(map).sort().map(function (L) {
      return { letter: L, items: map[L] };
    });
  }

  function renderList() {
    var groups = groupByLetter(filtered());
    var total = groups.reduce(function (n, g) { return n + g.items.length; }, 0);
    var catsHtml = CATS.map(function (c) {
      return '<button type="button" class="cat' + (c === state.cat ? " active" : "") +
        '" data-cat="' + esc(c) + '">' + esc(c) + "</button>";
    }).join("");

    var lettersHtml = groups.map(function (g) {
      return '<button type="button" class="letter" data-jump="' + esc(g.letter) + '">' +
        esc(g.letter) + "</button>";
    }).join("");

    var body;
    if (!items.length) {
      body = '<div class="loading">Loading…</div>';
    } else if (total === 0) {
      body = '<div class="empty">No legendaries match your search.</div>';
    } else {
      body =
        '<div class="alpha-bar">' +
          '<div class="letters">' + lettersHtml + "</div>" +
          '<span class="count">' + total + " items</span>" +
        "</div>" +
        '<div class="space-y-8">' +
        groups.map(function (g) {
          return (
            '<section class="letter-sec" id="letter-' + esc(g.letter) + '">' +
              '<div class="letter-head">' +
                "<h2>" + esc(g.letter) + "</h2>" +
                '<div class="rule"></div>' +
                '<span class="n">' + g.items.length + "</span>" +
              "</div>" +
              '<div class="grid">' +
              g.items.map(function (it) {
                var letter = (it.name || "?")[0];
                return (
                  '<a class="card" href="#/legendary/' + encodeURIComponent(it.id) + '">' +
                    '<div class="avatar">' + esc(letter) + "</div>" +
                    '<div class="meta">' +
                      '<p class="name">' + esc(it.name) + "</p>" +
                      '<p class="sub">' + esc(subLine(it)) + "</p>" +
                    "</div>" +
                    '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>' +
                  "</a>"
                );
              }).join("") +
              "</div>" +
            "</section>"
          );
        }).join("") +
        "</div>";
    }

    elList.innerHTML =
      "<div><h1>The Complete GW2 Legendaries Collection</h1></div>" +
      '<div class="space-y-3">' +
        '<div class="search-wrap">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>' +
          '<input class="search" id="q" type="search" placeholder="Search legendaries…" value="' + esc(state.q) + '"/>' +
        "</div>" +
        '<div class="cats">' + catsHtml + "</div>" +
      "</div>" +
      body;

    var q = document.getElementById("q");
    if (q) {
      q.addEventListener("input", function () {
        state.q = q.value;
        renderList();
        var again = document.getElementById("q");
        if (again) {
          again.focus();
          var len = again.value.length;
          try { again.setSelectionRange(len, len); } catch (e) {}
        }
      });
    }
    elList.querySelectorAll("[data-cat]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.cat = btn.getAttribute("data-cat");
        renderList();
      });
    });
    elList.querySelectorAll("[data-jump]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var target = document.getElementById("letter-" + btn.getAttribute("data-jump"));
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  }

  function renderDetail(id) {
    var it = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) { it = items[i]; break; }
    }
    if (!it) {
      elDetail.innerHTML = '<p class="empty">Legendary not found.</p>';
      return;
    }
    var fields = "";
    if (it.acquisition) {
      fields +=
        '<div class="field"><p class="lbl">How to obtain</p><p class="val">' +
        esc(it.acquisition) + "</p></div>";
    }
    if (it.notes) {
      fields +=
        '<div class="field"><p class="lbl">Notes</p><p class="val">' +
        esc(it.notes) + "</p></div>";
    }
    elDetail.innerHTML =
      '<a class="back" href="#/">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>' +
        " All legendaries" +
      "</a>" +
      '<div class="detail-head">' +
        '<div class="avatar lg">' + esc((it.name || "?")[0]) + "</div>" +
        "<div>" +
          "<h1>" + esc(it.name) + "</h1>" +
          '<p class="detail-sub">' + esc(detailMeta(it)) + "</p>" +
        "</div>" +
      "</div>" +
      (fields ? '<div class="detail-card">' + fields + "</div>" : "");
  }

  function route() {
    var hash = (location.hash || "#/").replace(/^#/, "");
    if (hash.charAt(0) !== "/") hash = "/" + hash;
    var m = hash.match(/^\/legendary\/([^/?#]+)/);
    if (m) {
      elList.classList.add("hidden");
      elDetail.classList.remove("hidden");
      renderDetail(decodeURIComponent(m[1]));
      window.scrollTo(0, 0);
    } else {
      elDetail.classList.add("hidden");
      elList.classList.remove("hidden");
      renderList();
    }
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
